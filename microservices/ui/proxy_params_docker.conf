# Shared proxy headers for the dashboard's reverse proxy.
# Kept in its own file so the four API locations stay readable.

proxy_http_version 1.1;

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;

# The services are threaded and their DB calls retry; do not hang the browser
# waiting on a service that is down.
proxy_connect_timeout 3s;
proxy_send_timeout    30s;
proxy_read_timeout    30s;

proxy_next_upstream          error timeout http_502 http_503 http_504;
proxy_next_upstream_tries    2;
proxy_next_upstream_timeout  5s;

proxy_buffering         on;
proxy_buffer_size       8k;
proxy_buffers           16 8k;
proxy_busy_buffers_size 16k;

# Buffer the upstream response so a slow client cannot make the Flask worker
# hold a thread open indefinitely.
proxy_request_buffering on;
