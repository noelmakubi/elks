# nginx config for the dashboard container.
#
# Two jobs:
#   1. Serve the static dashboard.
#   2. Reverse-proxy /api/<service>/* to the matching Flask service.
#
# Proxying means the browser only ever calls one origin, so the API ports never
# need to be published to the internet. It also means the dashboard works
# unchanged behind TLS and a load balancer.

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Log to stdout so `docker compose logs ui` shows access logs.
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" rt=$request_time';
    access_log  /dev/stdout  main;
    error_log   /dev/stderr  warn;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;
    server_tokens   off;
    client_max_body_size 1m;

    # gzip
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/javascript
                      application/json image/svg+xml;

    # Rate limit shared across the API locations: 30 requests/s with a small
    # burst. The dashboard polls every 15s, so this is generous.
    limit_req_zone  $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_status 429;

    # Upstreams declared once. `max_fails`/`fail_timeout` plus `next upstream`
    # inside proxy_next_upstream mean a dead service degrades instead of hanging
    # the dashboard, which matches the services' own degraded behaviour.
    upstream service_a { server service-a:5001 max_fails=3 fail_timeout=10s; }
    upstream service_b { server service-b:5002 max_fails=3 fail_timeout=10s; }
    upstream service_c { server service-c:5003 max_fails=3 fail_timeout=10s; }

    server {
        listen      8080;
        server_name _;

        root  /usr/share/nginx/html;
        index index.html;

        # ---- security headers -------------------------------------------
        add_header X-Content-Type-Options nosniff           always;
        add_header X-Frame-Options        DENY              always;
        add_header Referrer-Policy        no-referrer       always;
        # The dashboard is entirely self-hosted, so 'self' is the whole allowlist.
        add_header Content-Security-Policy
            "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
            always;

        location = /healthz {
            access_log off;
            default_type application/json;
            return 200 '{"status":"ok","component":"ui"}\n';
        }

        # ---- API reverse proxy ------------------------------------------
        # Three location blocks because the upstream is a literal name; a map
        # cannot be used in proxy_pass.
        location /api/service-a/ {
            limit_req zone=api_limit burst=60 nodelay;
            proxy_pass         http://service_a/;
            include            /etc/nginx/proxy_params_docker.conf;
        }

        location /api/service-b/ {
            limit_req zone=api_limit burst=60 nodelay;
            proxy_pass         http://service_b/;
            include            /etc/nginx/proxy_params_docker.conf;
        }

        location /api/service-c/ {
            limit_req zone=api_limit burst=60 nodelay;
            proxy_pass         http://service_c/;
            include            /etc/nginx/proxy_params_docker.conf;
        }

        # Note: /api/service-x/logs is served by the /api/service-x/ block
        # above, since nginx picks the longest matching prefix location.

        # ---- static assets ---------------------------------------------
        location / {
            try_files $uri $uri/ =404;
        }

        # `expires` rather than an add_header for Cache-Control: an add_header in
        # this block would discard every add_header inherited from the server
        # block, so the security headers above would stop being sent for
        # static files.
        location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
            expires 7d;
            try_files $uri =404;
        }

        error_page  500 502 503 504  /50x.html;
        location = /50x.html { root /usr/share/nginx/html; internal; }
    }
}
